# ============================================
# Artist Commission Platform - Docker Compose
# 一键启动: docker compose up -d
# ============================================
services:
  # Web 应用（前端 + 后端）
  web:
    image: commission-web:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    container_name: commission-web
    restart: unless-stopped
    # P2-运维：日志轮转（10MB x 3 文件），防磁盘被日志撑爆
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # P2-运维：内存上限 1g（compose 非 swarm 模式语法），防 OOM 拖垮宿主机
    mem_limit: 1g
    # 开发环境：端口映射到宿主机，方便本地浏览器直接访问
    # 生产部署：注释掉 ports 两行，仅保留 expose（走 Caddy 反向代理）
    # 详见 docs/开发→生产切换指南.md
    # v0.42 拍板（2026-08-07 用户选 B）：A 测已结束，生产收紧——注释 3000 映射，仅走 Caddy
    # ports:
    #   - "3000:3000"
    expose:
      - "3000"
    volumes:
      - ./data:/app/data          # SQLite 数据库持久化
      - ./uploads:/app/uploads    # 上传文件持久化
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # AUTH_DEV_MODE 由 .env 控制（开发=true / 生产=false 或删除）
      # 不在此处硬编码，否则 .env 的值会被覆盖
      - DB_PATH=/app/data/commission.db
      - UPLOAD_DIR=/app/uploads
      - TRUST_PROXY=172.16.0.0/12,10.0.0.0/8,192.168.0.0/16  # 仅信任 Docker 内网段，防 X-Forwarded-For 伪造
      - TZ=Asia/Shanghai          # SQLite CURRENT_TIMESTAMP 恒为 UTC，时区换算由应用层 date.ts 处理（此注释原为误导）
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Caddy 反向代理（自动 HTTPS + 泛解析）
  caddy:
    image: caddy:2-alpine
    container_name: commission-caddy
    restart: unless-stopped
    # P2-运维：日志轮转（10MB x 3 文件）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./desktop-updates:/srv/desktop-updates:ro   # 桌面端更新通道（825）：只读托管签名成品，投递规程见执行手册
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - .env              # 提供 DOMAIN 变量给 Caddyfile
    depends_on:
      web:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
