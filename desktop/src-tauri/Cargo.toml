[package]
name = "desktop"
version = "0.1.0"
description = "拾绘桌面版 - 画师约稿管理桌面端"
authors = ["拾绘"]
license = "AGPL-3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon feature：壳层商业化批托盘常驻必需（tauri::tray 模块由该 feature 门控）
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
# 窗口几何记忆（重启还原主窗口尺寸/位置；撕悬浮三件进 deny list，见 lib.rs）
tauri-plugin-window-state = "2"
# 开机自启（Windows 注册表 / macOS LaunchAgent / Linux 桌面自启）
tauri-plugin-autostart = "2"
# 壳层商业化三件（826）：系统通知 / 全局快捷键 / 单实例常驻
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
# 本地数据层（本地核心环波1）：SQLite 存本地记账等仅存本机数据
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 凭证保险箱走 Windows DPAPI（仅 Windows 首发；macOS 二期时改 target 条件分支）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

