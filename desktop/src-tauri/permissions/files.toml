# GHSA-6pf3-g4xq-854w Claim6 · 文件命令权限分组（高敏）
#
# 这里的每条 `allow-*` 由 build.rs 的 AppManifest::commands 自动生成在
# `permissions/autogenerated/<命令名>.toml`（单一事实源＝那份命令清单），本文件只做**按敏感度分组**，
# 不重复声明命令本体。capability 引的是下面的 set 标识符。
#
# 与 Rust 侧的分工：capability 决定「哪个窗能 invoke 这条命令」，
# `src/bridge/files.rs` 的白名单根 containment 决定「能写到/读到哪些路径」——两道各自独立、都要在。

[[set]]
identifier = "file-write"
description = "落盘写入类：导出物保存（desktop_save_file）、模板母版/副本复制（desktop_copy_file）、图缓存淘汰删除（desktop_delete_cache_file）。路径一律受 files.rs 白名单根约束（app_data_dir / 我的文档\\拾绘 / 用户个人目录）。仅主窗"
permissions = [
  "allow-desktop-save-file",
  "allow-desktop-copy-file",
  "allow-desktop-delete-cache-file",
]

[[set]]
identifier = "file-read"
description = "读取与探测类：文件转 base64（desktop_read_file_b64，5MB 上限）、备份包读取（desktop_read_backup_b64，100MB 上限）、存在性批量校验（desktop_check_files）、字节大小读取（desktop_file_sizes）。后两条是探测面（oracle），同受白名单根约束。仅主窗"
permissions = [
  "allow-desktop-read-file-b64",
  "allow-desktop-read-backup-b64",
  "allow-desktop-check-files",
  "allow-desktop-file-sizes",
]

[[set]]
identifier = "file-dirs"
description = "目录探测类：返回并顺带创建拾绘数据根（desktop_shihui_home）与图缓存目录（desktop_cache_dir）。只回路径字符串，不收前端入参。仅主窗"
permissions = [
  "allow-desktop-shihui-home",
  "allow-desktop-cache-dir",
]

[[set]]
identifier = "file-dialog"
description = "S5B 用户自选目录导出/导入类：壳侧调起原生「另存为/打开」对话框（desktop_export_save_b64 / desktop_import_read_b64）。命令类型上不接受目标路径参数，落点/取点只可能来自用户在 OS 对话框的选择，渲染层被攻破也无法伪造；与 file-write/file-read 的白名单根收敛互不削弱。仅主窗"
permissions = [
  "allow-desktop-export-save-b64",
  "allow-desktop-import-read-b64",
]
