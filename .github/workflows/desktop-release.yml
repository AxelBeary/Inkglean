# 桌面端发布流水线（825 更新通道施工批）
# 触发：推送 desktop-v* tag 或手动 dispatch
# 链路：Windows 构建 NSIS → tauri 内置 Ed25519 签名（私钥仅存 CI secrets，永不进服务器）
#       → 生成 latest.json（url 指向自托管目录）→ GitHub Release 产物发布
# 防投毒口径①（REQ-014 安全口径三）：签名只发生在流水线内，服务器只托管签名成品；
# 发布后由用户按《更新通道执行手册》把产物投递到服务器只读静态目录（保留前 3 版，坏版可回滚）。
name: desktop-release

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

# F-06（9/5 文档系统交叉审计批）补并发保护：发布与签名不可中途取消。
# 同一 ref 的两次触发（连推两个 tag / tag 与手动 dispatch 撞车）排队而非抢占，
# 防两个运行同时写同一份 latest.json 与 Release 产物（旧文件全程无 concurrency 块）。
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    # CodeQL #25 整改（826）：显式声明最小权限——仅发布 Release 产物需要写 contents，其余一概不给；
    # secrets/vars 读取不受 permissions 块影响，签名私钥链路不变（防投毒口径①）
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            shared/package-lock.json

      # windows-latest runner 预装 Rust stable + MSVC，tauri build 直接可用——移除 dtolnay/rust-toolchain：
      # 该 action ref 令 ci.yml workflow 连挂三次 startup failure（#1298/#1299/#1300，9/3 批排除法坐实真凶），
      # ci.yml desktop job 改用 runner 预装 Rust 后 cargo check 成功（#1301 全绿），发布流水线同口径防患于未然

      # F-05（9/5 文档系统交叉审计批）补共享包依赖安装：与 ci.yml desktop job（#1301 已跑绿同构口径）一致——
      # desktop 经 file:../shared 直导 shared 源码，file: 链接只带源码不带依赖，shared 自身依赖须先装，
      # 否则 desktop 的 build（vue-tsc --noEmit && vite build）在 shared 文件上报 TS2307/TS7006。
      # 8/26 那次（60772082）只给 ci.yml 补了这一步，发布流水线漏了；本步补上即闭合发版硬依赖。
      - name: Install shared dependencies
        working-directory: shared
        run: npm ci

      - name: 安装前端依赖
        run: npm ci

      # 更新端点注入（825 修复）：tauri.conf.json 的 {{ }} 模板只在部分 CLI 路径生效，dev 运行时直接解析会 panic；
      # 改为仓库存 *.invalid 占位，打包前用真实公网地址替换（仓库变量 DESKTOP_UPDATE_BASE）
      #
      # F-06（9/5 文档系统交叉审计批）守卫重写——旧写法是恒假守卫：
      #   旧 env 键 DESKTOP_UPDATE_ENDPOINT 的值是「vars.DESKTOP_UPDATE_BASE 表达式 + 字面量 /latest.json」的拼接，
      #   vars 未定义时展开成字面量 /latest.json（非空字符串），于是 if (-not $env:DESKTOP_UPDATE_ENDPOINT) 永不成立
      #   → 流水线照绿，并把 conf 里的绝对端点静默替换成相对路径，产出「更新功能必然坏掉」的安装包
      #   （实测仓库 variables/secrets 各 0 条，正是最容易踩中的那一支）。
      #   现改为：把 vars 原值单独注入 env（不参与任何拼接），守卫直接判原值三重闸——
      #   ① 去空白后为空（未配置 / 配成空串 / 只有空格）② 不以 http(s):// 开头（相对路径、残值）③ 仍是 *.invalid 占位域。
      #   另加事后闸：占位串在 conf 里没命中 → 说明替换根本没发生，也判红（防占位串被改动后静默发坏包）。
      - name: 注入更新端点
        shell: pwsh
        env:
          DESKTOP_UPDATE_BASE: ${{ vars.DESKTOP_UPDATE_BASE }}
        run: |
          $base = "$env:DESKTOP_UPDATE_BASE".Trim().TrimEnd('/')
          if (-not $base) { throw '仓库变量 DESKTOP_UPDATE_BASE 未配置（vars 展开为空）——见《更新通道执行手册》第 3 步' }
          if ($base -notmatch '^https?://') { throw "仓库变量 DESKTOP_UPDATE_BASE 不是绝对 URL：$base ——见《更新通道执行手册》第 3 步" }
          if ($base -match '\.invalid') { throw "仓库变量 DESKTOP_UPDATE_BASE 仍是占位域名：$base ——见《更新通道执行手册》第 3 步" }
          $endpoint = "$base/latest.json"
          $conf = 'src-tauri/tauri.conf.json'
          $text = Get-Content $conf -Raw
          $patched = $text.Replace('https://updates.invalid/desktop/latest.json', $endpoint)
          if ($patched -eq $text) { throw 'tauri.conf.json 未命中占位端点 https://updates.invalid/desktop/latest.json：替换没有发生（占位串被改动了？）' }
          Set-Content -Path $conf -Value $patched -Encoding utf8
          Write-Host "updater endpoint -> $endpoint"

      - name: 构建 + 签名（NSIS + updater 包）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis

      # latest.json：客户端启动检查的版本清单；signature 取自构建产物 .sig，url 指向自托管目录
      - name: 生成 latest.json
        shell: pwsh
        env:
          DESKTOP_UPDATE_BASE: ${{ vars.DESKTOP_UPDATE_BASE }}
        run: |
          $bundle = "src-tauri/target/release/bundle/nsis"
          $zip = Get-ChildItem $bundle -Filter *.nsis.zip | Select-Object -First 1
          if (-not $zip) { throw "未找到 .nsis.zip（签名私钥缺失或构建失败）" }
          $sig = (Get-Content "$($zip.FullName).sig" -Raw).Trim()
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          # 端点合法性已由「注入更新端点」步骤的守卫兜住（该步不过就走不到这里）；
          # 这里只做尾斜杠归一，防配置里带尾斜杠时 latest.json 出现双斜杠 url（F-06 顺带）
          $base = "$env:DESKTOP_UPDATE_BASE".Trim().TrimEnd('/')
          $manifest = @{
            version  = $conf.version
            notes    = "拾绘桌面版 $($conf.version)"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig
                url       = "$base/$($zip.Name)"
              }
            }
          } | ConvertTo-Json -Depth 6
          Set-Content -Path "$bundle/latest.json" -Value $manifest -Encoding utf8
          Write-Host $manifest

      - name: 发布 Release 产物（安装包 + 更新包 + 签名 + 清单）
        uses: softprops/action-gh-release@v2
        with:
          # F-06 Ⓜ 空跑保险：手动 dispatch（不推 tag）时只建草稿、不正式发布，
          # 让「先验证 shared 安装 + vue-tsc 环节」这条路可走（构建/类型检查排在签名步之前，红绿当场可见）；
          # tag 触发时表达式为 false，正式发布行为不变。
          # ⚠ 此处刻意不用 dry_run：已核 softprops/action-gh-release 的 action.yml（v2 线），
          #   inputs 只有 body/draft/prerelease/files/overwrite_files 等 17 项，**没有 dry_run**，
          #   写了会被 action 静默忽略＝假保险（dispatch 照样真建正式 Release）。draft 是官方真输入。
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip
            desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
            desktop/src-tauri/target/release/bundle/nsis/latest.json
