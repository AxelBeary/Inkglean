name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx oxlint src tests
      - run: npm run typecheck
      - run: npm test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            shared/package-lock.json
      # 824 shared 组件搬家：web typecheck/build 直导 ../shared 源码，file: 链接只带源码不带依赖，
      # shared 自身依赖（vue 类型声明等）须先装，否则 vue-tsc 在 shared 文件上报 TS2307/TS7006
      - name: Install shared dependencies
        working-directory: shared
        run: npm ci
      - run: npm ci
      - run: npx eslint .
      # TS 收尾迁移（2026-08-19）：vue-tsc strict 全量 + scripts 独立 tsconfig 把关
      - run: npm run typecheck
      # 清扫批#4: web 单测进 CI（此前只跑 lint+build，224 用例仅本地验证）
      - run: npx vitest run
      - run: npm run build
      # 源头防屎门禁：硬编码中文增量拦截（存量已进 baseline）
      - run: npm run check:i18n

  # P2-E：Dockerfile 门禁——Dockerfile 层问题（路径/权限/依赖）在合入前暴露
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Docker image build gate
        run: docker build -t commission-ci .

  # 桌面端门禁进 CI（9/3 批，发布前待办清单第 9 项）：windows runner 覆盖 Windows 专属代码
  # （DPAPI 保险箱 / 窗口枚举等 cfg(windows) 块，ubuntu 上会被跳过留盲区）+ 与 desktop-release.yml 环境一致，
  # 防「CI 绿但真机构建红」。四道门禁照 824 建齐口径：lint / test(185) / build / cargo check。
  # 注：Swatinem/rust-cache 首次引入即令整个 workflow startup failure（#1298/#1299 连挂，YAML 合法但 Actions 解析层拒绝），
  # 已移除；cargo check 无缓存全量编译（windows runner，timeout 20min 足够）。缓存优化待真凶定位后另议。
  desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            shared/package-lock.json
      # windows-latest runner 预装 Rust stable + MSVC 构建工具，cargo check 直接可用——
      # 移除 dtolnay/rust-toolchain：该 action 引用疑似触发 workflow startup failure（#1298/#1299/#1300 连挂，
      # 移除 Swatinem/rust-cache 后仍挂，dtolnay 为剩余最大嫌疑；desktop-release.yml 虽写了它但 tag 触发从未实际运行过），runner 预装 Rust 已足够
      # 同 web job：desktop 经 file:../shared 直导 shared 源码，file: 链接只带源码不带依赖，
      # shared 自身依赖（vue 类型声明等）须先装，否则 vue-tsc/vitest 在 shared 文件上报错（826 CI 坑教训）
      - name: Install shared dependencies
        working-directory: shared
        run: npm ci
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Cargo check
        working-directory: desktop/src-tauri
        run: cargo check
