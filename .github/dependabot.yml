# Dependabot 版本更新通道（2026-10-12 拍板）
# 背景：依赖警报已连续多周成批冒出（undici 18 条、brace-expansion/fast-uri 12 条、axios/busboy/dompurify 12 条），
#       历批都在"手动刷锁 + 关闭单目录 PR"上重复付费。本文件把通道改成正轨：机器人出可审 PR，人只负责过门禁与合并。
# 四条口径（均经用户拍板）：
#   1. 五目录全覆盖——root / server / web / desktop / shared 各有一份 lockfile，漏一个就会重演"PR 单锁范围不全被关掉"。
#   2. 每周一凌晨出批，避开白天施工。
#   3. 同批 minor + patch 合并成一个 PR（grouped），一次门禁覆盖一次合并。
#   4. major 不出自动 PR——破坏性跳版没有无人评审直接合入的份，需要升级时由人另立批次评估。
# 与仓库 Settings → Security 侧的 Dependabot security alerts / security updates 共存：本文件只管 version updates。
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/server"
      - "/web"
      - "/desktop"
      - "/shared"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
