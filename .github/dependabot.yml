# Dependabot 版本更新通道（2026-10-12 拍板）
# 背景：依赖警报已连续多周成批冒出（undici 18 条、brace-expansion/fast-uri 12 条、axios/busboy/dompurify 11 条），
#       历批都在"手动刷锁 + 关闭单目录 PR"上重复付费。本文件把通道改成正轨：机器人出可审 PR，人只负责过门禁与合并。
# 四条口径（均经用户拍板）：
#   1. 五目录全覆盖——root / server / web / desktop / shared 各有一份 lockfile，漏一个就会重演"PR 单锁范围不全被关掉"。
#   2. 每周一凌晨出批，避开白天施工。
#   3. 同批 minor + patch 合并成一个 PR（grouped），一次门禁覆盖一次合并。
#   4. major 不出自动 PR——破坏性跳版没有无人评审直接合入的份，需要升级时由人另立批次评估。
# 与仓库 Settings → Security 侧的 Dependabot security alerts / security updates 共存：本文件只管 version updates。
# 2026-10-13 增补（桌面端两条成对约束，PR #15 复盘换来的，详见 desktop/docs/STATUS.md）：
#   5. `/desktop` 拆独立条目并屏蔽 `@tauri-apps/*` 与 `typescript`——Tauri 官方要求 JS SDK 与 Rust crate
#      成对（核心同 minor、插件精确同号，https://v2.tauri.app/develop/updating-dependencies/ ），本文件只跑
#      npm 生态、天然无法成对；该比对只在 `tauri build/dev/info` 触发，CI 四 job 碰不到，等于把雷埋到发版。
#      桌面端 typescript 与该端仍停在 2.x 的 vue-tsc 是绑定组合，收敛到 web/shared 那套属单独一批（待办 U31）。
#   6. Rust 侧（Cargo）不建 version updates 通道：同上理由，crate 只允许与 npm 成对手工升；
#      漏洞类更新走 Security 侧自动 PR（首例：rustls #16 / 警报 #83）。
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/server"
      - "/web"
      - "/shared"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # 桌面 Tauri 全家桶只人工成对升（本项对上面四个目录是防御性冗余，包只在 /desktop 出现）
      - dependency-name: "@tauri-apps/*"

  # 桌面端单列：与 src-tauri 的 Cargo.lock 存在跨语言成对约束，自动通道只能动一边，故摘出关键耦合项
  - package-ecosystem: npm
    directory: "/desktop"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    groups:
      npm-minor-patch-desktop:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      - dependency-name: "@tauri-apps/*"
      - dependency-name: "typescript"
