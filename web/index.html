<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover：不补这一项，env(safe-area-inset-bottom) 在 iOS 全面屏上恒等于 0，
       OrderForm/MoMobileBar/吸底 CTA/悬浮件四处底部安全区留白全是死声明（2026-10-26 返工核实） -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- b4-12 裁决：品牌主语言为中文（拾绘 Inkglean），title/meta 静态中文保留；
       页面标题由路由守卫按 locale 动态更新，此处仅作首屏 SEO 兜底，不做双语切换 -->
  <!-- P2-12（v0.20）：基础 SEO meta — SPA 静态兜底，页面标题由路由守卫动态更新 -->
  <meta name="description" content="拾绘 Inkglean — 画师约稿平台。开源，自部署，易操作。" />
  <!-- REQ-043 I1: OG 注入占位锚点——server 端只替换「占位 meta → og:description」这一段（勿改结构/勿在此区外新增 og meta） -->
  <meta name="og-placeholder" />
  <meta property="og:title" content="拾绘 Inkglean — 画师约稿平台" />
  <meta property="og:description" content="开源，自部署，易操作。" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="拾绘 Inkglean" />
  <title>拾绘 Inkglean · 画师约稿平台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- 812-B4 CSP 锚点: 本内联脚本的 SHA-256 哈希已加白到 server/src/app.ts script-src；
       改动脚本内容必须同步更新该哈希（node 计算 raw textContent，含首尾空白）。
       首帧主题防闪白——在任何样式绘制前把持久化主题同步到 <html>
       （生效方式与 web/src/stores/theme.js 完全一致：客户端 huiyue-theme-base→html.dark/data-accent，
         后台 huiyue-artist-theme→data-artist-theme）；color-scheme 同步兜底浏览器控件层。
       存储不可用/读不到键时保持默认，不阻断首帧。 -->
  <style>
    html[data-artist-theme='paper'] { color-scheme: light; }
    html[data-artist-theme='ink'] { color-scheme: dark; }
    html.dark { color-scheme: dark; }
  </style>
  <script>
    (function () {
      try {
        var base = localStorage.getItem('huiyue-theme-base')
        if (base === 'dark') {
          document.documentElement.classList.add('dark')
        } else if (base === 'light') {
          document.documentElement.classList.remove('dark')
        } else {
          // store 默认 auto：跟随系统偏好（与 detectBase()/resolveDark() 一致）
          var systemDark = typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', systemDark)
        }
        var accent = localStorage.getItem('huiyue-theme-accent')
        if (accent) document.documentElement.setAttribute('data-accent', accent)
        var artistTheme = localStorage.getItem('huiyue-artist-theme')
        if (artistTheme === 'ink' || artistTheme === 'paper') {
          document.documentElement.setAttribute('data-artist-theme', artistTheme)
        }
      } catch (err) {
        // 存储不可用（隐私模式等）：保持默认主题，不阻断首帧
      }
    })()
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
